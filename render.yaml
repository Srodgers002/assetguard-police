services:
  # FastAPI Backend
  - type: web
    name: assetguard-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # React Frontend (Static Site)
  - type: web
    name: assetguard-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false   # You will fill this in the Render dashboard after backend deploys
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
